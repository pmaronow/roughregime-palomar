version: "v0.4"
project:
  name: "Nearly Minimax Rates for Functional Estimation Under Rough Random Design"
  description: >-
    A Lean development of upper and local lower minimax bounds for nonlinear
    functionals of conditional means under bounded, rough random design.
    The generic theorem covers the root-n regime and the subcritical regime
    with its density-dependent stretched-exponential correction, logarithmic
    upper and lower factors, and a one-quarter minimax probability lower bound.
    The substantive development also contains projection, polynomial-estimator,
    Poisson reduction, lattice-prior, application, and causal-identification
    results. The selected Comparator surface is the generic theorem's two parts.
    The remaining logarithmic gap is unresolved.
  authors: ["P. M. Aronow", "Patrick Lopatto"]
  responsible_maintainers: ["P. M. Aronow", "Patrick Lopatto"]
  license: "MIT"
classification:
  arxiv: ["stat.ME"]
  msc2020: ["62G05", "62G08", "62G20", "62C20"]
sources:
  - title: "Nearly Minimax Rates for Functional Estimation Under Rough Random Design"
    authors: ["P. M. Aronow", "Nathan Kallus", "Patrick Lopatto"]
    id: "https://hexagonmath.org/2610.00157?version=1"
    type: "paper"
    location: "Hexagon 2610.00157, version 1; source retained in paper/"
    relationship: "formalizes"
    note: >-
      Mathematical source is the attached version 1 paper. Theorem 2.3(a) and
      (b) are selected for Comparator. Other numbered claims have an explicit
      endpoint and scope map in docs/coverage.md. No source-author mathematical
      review or endorsement is inferred from authorship or responsibility.
status:
  scope: >-
    The standalone Challenge selects the full uniform generic upper theorem
    and local lower theorem, including both regimes and the subcritical
    probability bound. The substantive development is retained in RoughRegime/.
    Definitions of proposition-valued targets and conditional data structures
    are not counted as proofs. Cited attainment rates and background literature
    are outside the selected formal claims. Smooth-density refinements impose
    no uniform derivative bounds. The logarithmic gap is not resolved.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "RoughRegimeSubmission.mainUpper"
      file: "Solution.lean"
      comparator_config: "comparator.json"
    - declaration: "RoughRegimeSubmission.mainLower"
      file: "Solution.lean"
      comparator_config: "comparator.json"
automation:
  methods:
    - method: "agent"
      models: ["Sol 6.1"]
      tool_setup: "Autoformalization of the original mathematical development"
    - method: "agent"
      framework: "Codex"
      tool_setup: >-
        Subsequent local repository preparation, standalone Challenge/Solution
        interface, compiler and module-system compatibility, metadata,
        licensing, documentation, reproducible verification tools, and
        subsequent finite-order boundary-extension, coordinate-reconstruction,
        and ordinary-partial-to-Frechet proofs establishing equivalence with the
        literal Holder definition
    - method: "agent"
      framework: "Codex"
      tool_setup: >-
        Distinct automated mathematical-fidelity and numbered-claim review,
        source and dependency inspection, and mechanical verification review
  notes: >-
    The original autoformalization and subsequent preparation/review are
    separate roles. Historical input build reports are not fresh verification.
    Current completed checks and blockers are in docs/verification.json.
    Human mathematical review is not asserted.
fidelity:
  divergences: >-
    No intended weakening of the selected generic theorem. The positive M0
    parameter excludes inconsistent empty magnitude-bound choices; meaningful
    nonempty source classes already imply M0 > 0. Holder regularity uses
    ContDiffOn and derivatives within the closed cube. LiteralHolder proves
    equivalence with a genuine ordinary-coordinate-partial predicate, for all
    finite orders, and exact equality with the literal sum-of-maxima Holder norm,
    including its infinite-value cases. Ordinary interior partials have continuous
    extensions to the cube; no differentiability outside the cube is required.
    ContinuousPartials proves the interior partial-to-Frechet criterion;
    CoordinateJets proves exact finite-coordinate reconstruction;
    BoundaryRegularity proves the boundary passage. The Holder radius is unchanged.
    Statistical laws
    use Euclidean covariates with measurable conditional-moment witnesses,
    extended-real L2 risk, and an independent uniform real seed for randomization.
    The development contains bridges to the multi-index Holder convention and
    real-output Markov randomized estimators. Conditional intermediate lemmas
    retain their stated data and regularity hypotheses; these are discharged
    along the generic theorem's proof route. The selected interface omits
    application and background claims. See docs/fidelity.md and docs/coverage.md.
review:
  status: "agent-reviewed"
  reviewers: ["Codex (automated review)"]
  notes: >-
    Automated comparison of the attached paper and selected Lean statements,
    including hypotheses, quantifier order, rate normalizations, numbered
    claim targets, and proof-versus-definition status. Mechanical checks are
    separately documented with source fingerprints. Neither human mathematical
    review nor peer review is claimed.
alignment:
  namespace: "RoughRegimeSubmission"
  statements:
    - source: "Theorem 2.3(a), label thm:generic"
      lean: "RoughRegimeSubmission.mainUpper"
      module: "Solution"
      status: "proved"
      note: "Uniform upper constants precede response spaces and observables."
    - source: "Theorem 2.3(b), label thm:generic"
      lean: "RoughRegimeSubmission.mainLower"
      module: "Solution"
      status: "proved"
      note: "Local lower constants precede intermediate classes and sample sizes."
acknowledgements: >-
  Lean, Mathlib and its dependencies; Sol 6.1 for original autoformalization;
  Codex for subsequent preparation, compatibility work, and automated review;
  Palomar for the public verification-contract tools retained with their notices.
